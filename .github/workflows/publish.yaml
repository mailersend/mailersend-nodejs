name: NPM Publish
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # The tag is the only source of the version; package.json holds a placeholder.
      - name: Set the version from the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version such as v1.2.3"
            exit 1
          fi
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm ci
      # A pre-release such as v3.8.0-rc.1 must not become the default install.
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
